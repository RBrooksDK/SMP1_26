# Project information
site_name: Stochastic Modelling and Processes
site_url: https://rbrooksdk.github.io/SMP1_26
site_author: Richard Brooks
site_description: Course page for Stochastic Modelling and Processes at VIA University College
docs_dir: .
site_dir: _site
# Repository information
repo_name: Github
repo_url: https://github.com/RBrooksDK/SMP1_26

# Copyright
copyright: Copyright &copy; 2026 Richard Brooks

# Configurations
theme:
  name: material
  language: en
  default_theme: default
  # custom_dir: overrides
  favicon: figures/vialogo_white.png
  logo: figures/vialogo.png
  icon:
    repo: fontawesome/brands/github
    annotation: material/chevron-right-circle
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    # - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - scheme: default
      accent: orange
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: "VIA Type"
    code: "Roboto Mono"

plugins:
  - same-dir
  - blog
  - search
  - mkdocs_quiz:
      lang: en

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js

extra:
  status:
    new: Recently added
    deprecated: Deprecated
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: material/email
      link: mailto:rib@via.dk
    - icon: fontawesome/brands/github
      link: https://github.com/RBrooksDK/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rbrooks-dk/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: README.md
  - Sessions:
    - Sessions/README.md
    - 00 Prerequisites: 00_Prerequisites/README.md
    - 01 Probability Foundations and Random Variables: 01_Probability_Foundations_and_Random_Variables/README.md
    - 02 Discrete Random Variables: 02_Discrete_Random_Variables/README.md
    - 03 Continuous Random Variables: 03_Continuous_Random_Variables/README.md
    - 04 Joint Distributions: 04_Joint_Distributions/README.md
    - 05 Conditional Distributions and Dependence: 05_Conditional_Distributions_and_Dependence/README.md
    - 06 Random Sampling, Monte Carlo, and Limit Theorems: 06_Random_Sampling_Monte_Carlo_and_Limit_Theorems/README.md
    - 07 Stochastic Processes and Poisson Processes: 07_Stochastic_Processes_and_Poisson_Processes/README.md
    - 08 Time-Series Fundamentals: 08_Time_Series_Fundamentals/README.md
    - 09 Autoregressive Models and Forecasting: 09_Autoregressive_Models_and_Forecasting/README.md
    - 10 Markov Chains: 10_Markov_Chains/README.md
    - 11 Markov Chains and Course Recap: 11_Markov_Chains_and_Course_Recap/README.md
  - Exam: pages/exam.md
  - FAQ: pages/faq.md
  - General Resources SMP: https://viaucdk-my.sharepoint.com/:f:/g/personal/rib_viauc_dk/Egbdbeb9oy1Oqk8hReXf2-wBibryPlLiVj2ujGdsvH5--w?e=liO02A
